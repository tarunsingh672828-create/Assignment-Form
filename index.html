<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            background: linear-gradient(90deg,skyblue,violet);
            justify-content: center;
            display: flex;
            align-items: center;
            
        }
        form{
            height: 80%;
            width: 30%;
            background-color: white;
            border-radius: 10px;
            
        }
         .email,.Password,.login{
            /* border: 1px solid black; */
            width: 80%;
            height: 20%;
            margin: auto;
            margin-top: 5%;
         }   
         input{
            width: 100%;
            height: 40%;
            margin-top: 5%;
            outline: none;
            border: none;
            background-color: lightgray;
         }
         p{
            margin-top: 5%;
            font-size: larger;
         }
         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        h1{
            margin-top: 10%;
        }
        label{
            font-size: larger;
        }
        #login{
            background: linear-gradient(90deg,skyblue,violet);
            color: white;
            font-size: larger;
        }
        .login>p{
            text-align: center;
        }
    </style>
</head>
<body>
    <form action="">
        <h1 align="center">login form</h1>
        <div class="email">
            <label for="">Email</label>
            <input type="Email" name="" id="" placeholder="xyz@gmail.com">
            </div>

        <div class="Password">
            <label for="">Password</label>
             <input type="password" name="" id="" placeholder="xyz@123">
             <p>Forget Password?</p>
            </div>
        <div class="login">
            <input type="button" value="login" id="login"><br>
            <p>Not a Member ? <a href="sform.html">signUP</a></p>
        </div>
        
</body>
</html>
